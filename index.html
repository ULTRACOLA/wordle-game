<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1ead9">
  <title>字謎報 | WORDLE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="paper">
    <header class="masthead">
      <div class="edition">第 001 號 · 每日一字</div>
      <h1>字謎報</h1>
      <div class="masthead-meta"><span>WORDLE DAILY</span><span id="date">載入日期中</span></div>
    </header>

    <section class="intro" aria-labelledby="game-title">
      <div>
        <p class="kicker">TODAY'S PUZZLE</p>
        <h2 id="game-title">六次猜出今日密語</h2>
        <p class="instructions">輸入五個字母的英文單字。每一天，大家挑戰同一個答案。</p>
      </div>
      <button class="icon-button" id="help-button" type="button" aria-label="查看玩法說明" title="玩法說明">?</button>
    </section>

    <section class="game-layout" aria-label="Wordle 遊戲區">
      <div class="board-wrap">
        <div class="board" id="board" aria-label="猜字盤"></div>
        <p class="status" id="status" role="status" aria-live="polite">開始你的第一猜。</p>
      </div>
      <aside class="score-card" aria-label="今日戰績">
        <div class="score-heading"><span>今日戰績</span><span class="dot"></span></div>
        <div class="stat-row"><span>連勝</span><strong id="streak">0</strong></div>
        <div class="stat-row"><span>完成次數</span><strong id="played">0</strong></div>
        <div class="stat-row"><span>成功率</span><strong id="win-rate">0%</strong></div>
        <button class="new-game" id="new-game" type="button">開啟新謎題 <span>↗</span></button>
      </aside>
    </section>

    <section class="keyboard" id="keyboard" aria-label="虛擬鍵盤"></section>
    <footer class="footer"><span>每日 00:00 更新</span><span>字謎報 · 請冷靜思考</span></footer>
  </main>

  <dialog id="help-dialog">
    <button class="dialog-close" id="close-help" type="button" aria-label="關閉說明">×</button>
    <p class="kicker">HOW TO PLAY</p>
    <h2>玩法說明</h2>
    <p>在六次機會內猜出五個字母的英文單字。</p>
    <ul>
      <li><b class="legend correct">A</b> 字母正確且位置正確</li>
      <li><b class="legend present">B</b> 字母存在但位置不同</li>
      <li><b class="legend absent">C</b> 答案中沒有這個字母</li>
    </ul>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
